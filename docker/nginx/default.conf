# Internal web server of the LSG stack. Plain HTTP only: TLS, certificates and the
# public reverse proxy (e.g. Cloudflare) live outside of this project.

server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 1m;

  include /etc/nginx/mime.types;
  types {
    model/gltf-binary glb;
    model/gltf+json gltf;
    image/ktx2 ktx2;
    application/manifest+json webmanifest;
  }

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json
    image/svg+xml model/gltf+json application/wasm;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com" always;

  # Docker's embedded DNS; resolving at request time lets nginx start before the API.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $lsg_api http://api:3000;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass $lsg_api;
    proxy_http_version 1.1;
    # $http_host keeps the port (e.g. localhost:8080) so Origin checks match the browser address.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
  }

  # Hashed build output never changes: cache forever.
  location ~ ^/(admin/)?assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Asked by open games to detect a newer build; must never come from a cache.
  location = /version.json {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location /admin/ {
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    try_files $uri $uri/ /admin/index.html;
  }

  location = /admin {
    return 301 /admin/;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com" always;
    try_files $uri $uri/ /index.html;
  }
}
