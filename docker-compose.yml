# LSG production stack.
#
#   docker compose up -d --build
#
# Exposes exactly one plain HTTP port (LSG_HTTP_PORT, default 8080).
# TLS, certificates and the public reverse proxy (e.g. Cloudflare) are not part of this project.
# Persistent data lives in ./data next to this file (bind mount, no Docker volumes).

name: lsg

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: lsg-api:latest
    container_name: lsg-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      LSG_DATA_DIR: /data
    volumes:
      - ./data:/data
    expose:
      - '3000'

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: lsg-web:latest
    container_name: lsg-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${LSG_HTTP_PORT:-8080}:80'
